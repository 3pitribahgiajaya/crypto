name: BEN AI Paper Engine Tests
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/paper-engine-tests.yml"
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/paper-engine-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: worker
